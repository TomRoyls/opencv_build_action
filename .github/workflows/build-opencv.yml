name: "Build OpenCV"

on:
  workflow_dispatch:
    inputs:
      opencv_ref:
        description: "OpenCV tag to build"
        default: "5.0.0"
        type: string
  push:
    tags:
      # tag '<opencv-version>[-rN]' (e.g. 5.0.0, 5.0.0-r2): builds that OpenCV version and publishes a release
      - "5.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCV_REF: ${{ inputs.opencv_ref || github.ref_name || '5.0.0' }}
  # 5.0.0 module names. geometry+stereo are auto-deps of imgproc/calib but listed explicitly; ml+xphoto come from opencv_contrib (aruco ships inside objdetect)
  BUILD_MODULES: "core,imgproc,flann,geometry,features,calib,stereo,photo,stitching,video,objdetect,ml,xphoto"

jobs:
  windows:
    name: windows (${{ matrix.crt }})
    # all hosted windows images now ship VS2026 only - use Ninja + MSVC dev env instead of a VS generator
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        crt: [mt, md]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch sources
        shell: bash
        run: |
          OPENCV_CLONE_REF="${OPENCV_REF%%-r*}"
          git clone --depth 1 --branch "$OPENCV_CLONE_REF" https://github.com/opencv/opencv.git opencv
          git clone --depth 1 --branch "$OPENCV_CLONE_REF" https://github.com/opencv/opencv_contrib.git opencv_contrib
          git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git eigen

      - name: Configure
        shell: bash
        env:
          CRT_FLAG: ${{ matrix.crt == 'mt' && 'ON' || 'OFF' }}
        run: |
          cmake -S opencv -B build -G Ninja \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=$BUILD_MODULES \
            -DOPENCV_EXTRA_MODULES_PATH=$GITHUB_WORKSPACE/opencv_contrib/modules \
            -DBUILD_opencv_world=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_JAVA=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_IPP=OFF \
            -DWITH_ITT=OFF \
            -DWITH_EIGEN=ON \
            -DEIGEN_INCLUDE_PATH:PATH=$GITHUB_WORKSPACE/eigen \
            -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON \
            -DWITH_LAPACK=OFF \
            -DWITH_TBB=OFF \
            -DWITH_OPENMP=OFF \
            -DWITH_PROTOBUF=OFF \
            -DWITH_FLATBUFFERS=OFF \
            -DWITH_UNIFONT=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_JPEG=OFF \
            -DWITH_PNG=OFF \
            -DWITH_TIFF=OFF \
            -DWITH_WEBP=OFF \
            -DWITH_OPENJPEG=OFF \
            -DWITH_JPEGXL=OFF \
            -DWITH_JASPER=OFF \
            -DWITH_AVIF=OFF \
            -DWITH_VTK=OFF \
            -DWITH_GTK=OFF \
            -DWITH_TESSERACT=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_GSTREAMER=OFF \
            -DWITH_1394=OFF \
            -DWITH_VA=OFF \
            -DWITH_VA_INTEL=OFF \
            -DWITH_OPENCLAMDFFT=OFF \
            -DWITH_OPENCLAMDBLAS=OFF \
            -DENABLE_CONFIG_VERIFICATION=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install \
            -DWITH_PTHREADS_PF=OFF \
            -DWITH_OPENCL_D3D11_NV=OFF \
            -DBUILD_WITH_STATIC_CRT=$CRT_FLAG

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Install
        shell: bash
        run: cmake --install build --config Release

      - name: Package
        shell: bash
        run: cd install && 7z a -tzip ../opencv-${OPENCV_REF}-windows-x64-${{ matrix.crt }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencv-${{ env.OPENCV_REF }}-windows-x64-${{ matrix.crt }}
          path: opencv-*.zip
          # archive: false skips the wrapper zip (name: is ignored, artifact is named after the file)
          archive: false

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sources
        shell: bash
        run: |
          OPENCV_CLONE_REF="${OPENCV_REF%%-r*}"
          git clone --depth 1 --branch "$OPENCV_CLONE_REF" https://github.com/opencv/opencv.git opencv
          git clone --depth 1 --branch "$OPENCV_CLONE_REF" https://github.com/opencv/opencv_contrib.git opencv_contrib
          git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git eigen
          # build_framework.py requires a named branch (git branch --show-current); tag clones are detached HEAD
          git -C opencv checkout -B ci-build

      # contrib modules are not reachable via the Apple scripts (fixed CMake arg list, no -D passthrough) - vendor them into the main tree
      - name: Vendor contrib modules into main tree
        shell: bash
        run: |
          cp -R opencv_contrib/modules/ml opencv/modules/ml
          cp -R opencv_contrib/modules/xphoto opencv/modules/xphoto

      # build_xcframework.py phase 3 unconditionally copytrees <platform>/docs; --without objc skips doc generation
      - name: Pre-create docs dirs for xcframework script
        shell: bash
        run: mkdir -p out/iphoneos/docs out/iphonesimulator/docs out/macos/docs

      - name: Build xcframework
        shell: bash
        run: |
          # OpenCV's apple scripts pass feature names verbatim into -DWITH_<name>=OFF and CMake vars
          # are case-sensitive: feature names MUST be uppercase or they are silently ignored
          # (Eigen is NOT disabled here - it is injected via the cmake shim below)
          # shim cmake: the scripts accept no arbitrary cmake args, so inject Eigen via PATH wrapper
          REAL_CMAKE="$(command -v cmake)"
          mkdir -p cmake-shim
          cat > cmake-shim/cmake <<EOF
          #!/bin/bash
          # inject extra defines only for configure invocations (source dir is the last argument)
          if [ \$# -gt 0 ] && [ -d "\${@: -1}" ]; then
            exec "$REAL_CMAKE" "\$@" -DWITH_EIGEN=ON "-DEIGEN_INCLUDE_PATH:PATH=$GITHUB_WORKSPACE/eigen" -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON
          fi
          exec "$REAL_CMAKE" "\$@"
          EOF
          chmod +x cmake-shim/cmake
          export PATH="$GITHUB_WORKSPACE/cmake-shim:$PATH"
          # static by default (APPLE_FRAMEWORK forces BUILD_SHARED_LIBS=OFF; all module .a merged via libtool into opencv2.framework)
          # NOTE: opencv_world is force-ON under APPLE_FRAMEWORK — expected, harmless for static packaging
          # --without X => BUILD_opencv_X=OFF; --disable X => WITH_X=OFF (only injection path these scripts support)
          python3 opencv/platforms/apple/build_xcframework.py \
            --out "$GITHUB_WORKSPACE/out" \
            --build_only_specified_archs \
            --iphoneos_archs arm64 \
            --iphonesimulator_archs arm64 \
            --macos_archs arm64 \
            --iphoneos_deployment_target 16.0 \
            --macosx_deployment_target 14.0 \
            --without dnn --without imgcodecs --without videoio --without highgui \
            --without objc --without java --without js --without python --without ts \
            --without ptcloud \
            --disable CUDA --disable IPP --disable ITT --disable OPENCL --disable LAPACK \
            --disable TBB --disable PROTOBUF --disable FLATBUFFERS \
            --disable UNIFONT --disable OPENEXR \
            --disable JPEG --disable PNG --disable TIFF --disable WEBP \
            --disable OPENJPEG --disable JPEGXL --disable JASPER

      - name: Package
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent out/opencv2.xcframework opencv-${OPENCV_REF}-apple-arm64-xcframework.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencv-${{ env.OPENCV_REF }}-apple-arm64-xcframework
          path: opencv-*-xcframework.zip
          archive: false

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sources
        shell: bash
        run: |
          OPENCV_CLONE_REF="${OPENCV_REF%%-r*}"
          git clone --depth 1 --branch "$OPENCV_CLONE_REF" https://github.com/opencv/opencv.git opencv
          git clone --depth 1 --branch "$OPENCV_CLONE_REF" https://github.com/opencv/opencv_contrib.git opencv_contrib
          git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git eigen

      - name: Configure
        shell: bash
        run: |
          cmake -S opencv -B build -G Ninja \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=$BUILD_MODULES \
            -DOPENCV_EXTRA_MODULES_PATH=$GITHUB_WORKSPACE/opencv_contrib/modules \
            -DBUILD_opencv_world=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_JAVA=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_IPP=OFF \
            -DWITH_ITT=OFF \
            -DWITH_EIGEN=ON \
            -DEIGEN_INCLUDE_PATH:PATH=$GITHUB_WORKSPACE/eigen \
            -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON \
            -DWITH_LAPACK=OFF \
            -DWITH_TBB=OFF \
            -DWITH_OPENMP=OFF \
            -DWITH_PROTOBUF=OFF \
            -DWITH_FLATBUFFERS=OFF \
            -DWITH_UNIFONT=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_JPEG=OFF \
            -DWITH_PNG=OFF \
            -DWITH_TIFF=OFF \
            -DWITH_WEBP=OFF \
            -DWITH_OPENJPEG=OFF \
            -DWITH_JPEGXL=OFF \
            -DWITH_JASPER=OFF \
            -DWITH_AVIF=OFF \
            -DWITH_VTK=OFF \
            -DWITH_GTK=OFF \
            -DWITH_TESSERACT=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_GSTREAMER=OFF \
            -DWITH_1394=OFF \
            -DWITH_VA=OFF \
            -DWITH_VA_INTEL=OFF \
            -DWITH_OPENCLAMDFFT=OFF \
            -DWITH_OPENCLAMDBLAS=OFF \
            -DENABLE_CONFIG_VERIFICATION=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Install
        shell: bash
        run: cmake --install build

      # Built on ubuntu-24.04 (glibc 2.39): consumers must link on glibc >= 2.39
      - name: Package
        shell: bash
        run: cd install && tar czf ../opencv-${OPENCV_REF}-linux-x64.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencv-${{ env.OPENCV_REF }}-linux-x64
          path: opencv-*.tar.gz
          archive: false

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sources
        shell: bash
        run: |
          OPENCV_CLONE_REF="${OPENCV_REF%%-r*}"
          git clone --depth 1 --branch "$OPENCV_CLONE_REF" https://github.com/opencv/opencv.git opencv
          git clone --depth 1 --branch "$OPENCV_CLONE_REF" https://github.com/opencv/opencv_contrib.git opencv_contrib
          git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git eigen

      # ANDROID_NDK env var is pre-set on GitHub ubuntu runners (NDK 27.x); static libs land in install/sdk/native/staticlibs/arm64-v8a/
      - name: Configure
        shell: bash
        run: |
          cmake -S opencv -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DBUILD_ANDROID_PROJECTS=OFF \
            -DBUILD_ANDROID_EXAMPLES=OFF \
            -DBUILD_KOTLIN_EXTENSIONS=OFF \
            -DINSTALL_CREATE_DISTRIB=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=$BUILD_MODULES \
            -DOPENCV_EXTRA_MODULES_PATH=$GITHUB_WORKSPACE/opencv_contrib/modules \
            -DBUILD_opencv_world=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_JAVA=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_IPP=OFF \
            -DWITH_ITT=OFF \
            -DWITH_EIGEN=ON \
            -DEIGEN_INCLUDE_PATH:PATH=$GITHUB_WORKSPACE/eigen \
            -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON \
            -DWITH_LAPACK=OFF \
            -DWITH_TBB=OFF \
            -DWITH_OPENMP=OFF \
            -DWITH_PROTOBUF=OFF \
            -DWITH_FLATBUFFERS=OFF \
            -DWITH_UNIFONT=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_JPEG=OFF \
            -DWITH_PNG=OFF \
            -DWITH_TIFF=OFF \
            -DWITH_WEBP=OFF \
            -DWITH_OPENJPEG=OFF \
            -DWITH_JPEGXL=OFF \
            -DWITH_JASPER=OFF \
            -DWITH_AVIF=OFF \
            -DWITH_VTK=OFF \
            -DWITH_GTK=OFF \
            -DWITH_TESSERACT=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_GSTREAMER=OFF \
            -DWITH_1394=OFF \
            -DWITH_VA=OFF \
            -DWITH_VA_INTEL=OFF \
            -DWITH_OPENCLAMDFFT=OFF \
            -DWITH_OPENCLAMDBLAS=OFF \
            -DENABLE_CONFIG_VERIFICATION=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Install
        shell: bash
        run: cmake --install build

      - name: Package
        shell: bash
        run: cd install && tar czf ../opencv-${OPENCV_REF}-android-arm64-v8a.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: opencv-${{ env.OPENCV_REF }}-android-arm64-v8a
          path: opencv-*.tar.gz
          archive: false

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          # archive:false artifacts: keep original zip/tar.gz files - v8 would otherwise extract the zips
          # and dist/* would contain directories, which breaks gh release upload
          skip-decompress: true

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "OpenCV $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/opencv-* --repo "$GITHUB_REPOSITORY" --clobber
